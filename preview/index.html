<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Spine 资源画廊 — zhsmxb</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #1e1e1e; color: #ddd; }
  #app { display: flex; height: 100%; }

  /* 左侧栏 */
  #sidebar { width: 320px; min-width: 320px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
  #sidebar header { padding: 12px; border-bottom: 1px solid #333; }
  #sidebar h1 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  #search { width: 100%; padding: 6px 10px; background: #1e1e1e; border: 1px solid #444; color: #ddd; border-radius: 4px; font-size: 13px; outline: none; }
  #search:focus { border-color: #007acc; }
  #stats { font-size: 11px; color: #888; margin-top: 6px; }
  #list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .cat { font-size: 11px; color: #888; text-transform: uppercase; padding: 8px 12px 4px; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
  .cat:hover { color: #ccc; }
  .cat .count { color: #555; margin-left: 4px; }
  .cat.collapsed + .cat-items { display: none; }
  .item { padding: 4px 12px 4px 24px; font-size: 12px; color: #ccc; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #2a2d2e; }
  .item.active { background: #094771; color: #fff; }
  .item.hidden { display: none; }

  /* 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { padding: 10px 16px; background: #2d2d2d; border-bottom: 1px solid #333; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #toolbar > * { font-size: 13px; }
  #toolbar select, #toolbar input[type=range] { background: #1e1e1e; border: 1px solid #444; color: #ddd; padding: 4px 8px; border-radius: 3px; outline: none; }
  #toolbar label { color: #888; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #toolbar button { background: #0e639c; color: #fff; border: none; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { background: #1177bb; }
  #title { color: #fff; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 渲染区 */
  #stage { flex: 1; position: relative; overflow: hidden; background: linear-gradient(135deg, #2a2a2a 25%, transparent 25%) -8px 0/16px 16px,
                                                                  linear-gradient(225deg, #2a2a2a 25%, transparent 25%) -8px 0/16px 16px,
                                                                  linear-gradient(45deg, #2a2a2a 25%, transparent 25%) 0 8px/16px 16px,
                                                                  linear-gradient(315deg, #2a2a2a 25%, transparent 25%) 0 8px/16px 16px,
                                                                  #1e1e1e; }
  #canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }
  #status { position: absolute; bottom: 12px; left: 16px; font-size: 12px; color: #888; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 3px; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 16px; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>🎬 Spine 资源画廊</h1>
      <input id="search" type="text" placeholder="搜索资源... (按分类/名称过滤)">
      <div id="stats">加载中...</div>
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="toolbar">
      <span id="title">— 请从左侧选一个资源 —</span>
      <label>动画 <select id="anim"></select></label>
      <label><input type="checkbox" id="loop" checked> 循环</label>
      <label>速度 <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"> <span id="speed-val">1.0x</span></label>
      <label>缩放 <input type="range" id="scale" min="0.1" max="3" step="0.05" value="1"> <span id="scale-val">1.0x</span></label>
      <label><input type="checkbox" id="character-only"> 只显示人物</label>
      <button id="reset">重置</button>
      <button id="bg">切换背景</button>
    </div>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="empty">从左侧选一个资源开始预览</div>
      <div id="status"></div>
    </div>
  </main>
</div>

<script src="lib/spine-webgl.js"></script>
<script src="lib/spine-skeleton-binary-3.6.js"></script>
<script src="app.js"></script>
</body>
</html>
